name: HealthScribe 24/7 Keep-Alive Pinger

on:
  schedule:
    # Trigger every 5 hours to restart the loop with overlap
    - cron: '0 */5 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time

concurrency:
  group: healthscribe-pinger
  cancel-in-progress: true

jobs:
  pinger-loop:
    name: Keep-Alive Ping Loop (5h 45m)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Ping Django Backend and AI Service
        run: |
          DURATION=20700          # 5 hours 45 minutes in seconds
          INTERVAL=600            # 10 minutes in seconds (under Render's 15-min idle timeout)

          DJANGO_URL="https://healthscribe-django.onrender.com/health"
          AI_URL="https://healthscribe-ai-xexh.onrender.com/health"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          END_TIME=$((SECONDS + DURATION))
          PING_NUM=0

          echo "========================================================="
          echo "HealthScribe Keep-Alive Pinger Started"
          echo "Django URL:    $DJANGO_URL"
          echo "AI URL:        $AI_URL"
          echo "Loop Duration: $((DURATION / 3600))h $((DURATION % 3600 / 60))m"
          echo "Interval:      $((INTERVAL / 60)) minutes"
          echo "========================================================="
          echo ""

          while [ $SECONDS -lt $END_TIME ]; do
            PING_NUM=$((PING_NUM + 1))
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

            # 1. Ping Django Backend
            DJANGO_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              -H "User-Agent: $UA" \
              -H "Accept: application/json" \
              "$DJANGO_URL" 2>/dev/null || echo "000")

            # 2. Ping FastAPI AI Service
            AI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              -H "User-Agent: $UA" \
              -H "Accept: application/json" \
              "$AI_URL" 2>/dev/null || echo "000")

            # Quick 5-second retry if either service wasn't 200 (in case of brief cold-boot lag)
            if [ "$DJANGO_STATUS" != "200" ]; then
              sleep 5
              DJANGO_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 120 \
                -H "User-Agent: $UA" \
                -H "Accept: application/json" \
                "$DJANGO_URL" 2>/dev/null || echo "000")
            fi

            if [ "$AI_STATUS" != "200" ]; then
              sleep 5
              AI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 120 \
                -H "User-Agent: $UA" \
                -H "Accept: application/json" \
                "$AI_URL" 2>/dev/null || echo "000")
            fi

            echo "[$TIMESTAMP] Ping #$PING_NUM — Django: $DJANGO_STATUS | AI Service: $AI_STATUS"

            # Sleep until next ping interval or remaining loop time
            REMAINING=$((END_TIME - SECONDS))
            if [ $REMAINING -gt $INTERVAL ]; then
              sleep $INTERVAL
            else
              sleep $REMAINING 2>/dev/null || true
            fi
          done

          echo ""
          echo "========================================================="
          echo "Loop finished cleanly after $PING_NUM pings."
          echo "Next scheduled cron run will take over."
          echo "========================================================="
