name: Render 24/7 Keep-Alive

on:
  schedule:
    # Trigger every 5 hours (continuous loop inside will run for 5h 45m, creating a 45m fail-safe overlap)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive-loop:
    name: Continuous Keep-Alive Loop
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Run 5h 45m Keep-Alive Loop
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL || 'https://healthscribe-backend.onrender.com' }}"
          AI_URL="${{ secrets.AI_SERVICE_URL || 'https://healthscribe-ai.onrender.com' }}"
          
          BACKEND_HEALTH="${BACKEND_URL%/}/health"
          AI_HEALTH="${AI_URL%/}/health"
          
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          DURATION=20700  # 5 hours 45 minutes in seconds
          INTERVAL=600   # 10 minutes in seconds
          
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + DURATION))
          
          echo "========================================================="
          echo "Starting 24/7 Keep-Alive Loop at $(date -u)"
          echo "Target Backend: $BACKEND_HEALTH"
          echo "Target AI Service: $AI_HEALTH"
          echo "Loop Duration: $DURATION seconds (5h 45m)"
          echo "Ping Interval: $INTERVAL seconds (10m)"
          echo "========================================================="
          
          ping_endpoint() {
            local service_name="$1"
            local target_url="$2"
            
            echo "[$service_name] Pinging $target_url at $(date -u)"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "$USER_AGENT" \
              -H "Accept: application/json" \
              --max-time 120 \
              "$target_url" || echo "ERR")
            
            if [ "$HTTP_CODE" != "200" ]; then
              echo "[$service_name] Received non-200 status: $HTTP_CODE. Retrying in 10 seconds..."
              sleep 10
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -A "$USER_AGENT" \
                -H "Accept: application/json" \
                --max-time 120 \
                "$target_url" || echo "ERR")
            fi
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "[$service_name] Status: 200 OK"
            else
              echo "[$service_name] WARNING: Final response code: $HTTP_CODE"
            fi
          }
          
          ITERATION=1
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((END_TIME - CURRENT_TIME))
            
            if [ $REMAINING -le 0 ]; then
              echo "Reached target loop duration of $DURATION seconds. Exiting loop cleanly."
              break
            fi
            
            echo "--- Iteration $ITERATION (Elapsed: ${ELAPSED}s / Remaining: ${REMAINING}s) ---"
            ping_endpoint "Django Backend" "$BACKEND_HEALTH"
            ping_endpoint "FastAPI AI" "$AI_HEALTH"
            
            ITERATION=$((ITERATION + 1))
            
            if [ $REMAINING -lt $INTERVAL ]; then
              echo "Sleeping remaining $REMAINING seconds before loop exit..."
              sleep $REMAINING
              break
            fi
            
            echo "Sleeping $INTERVAL seconds until next ping..."
            sleep $INTERVAL
          done
          
          echo "Keep-alive session completed successfully at $(date -u)"
