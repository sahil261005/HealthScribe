name: 24/7 HealthScribe Keep-Alive Ping

on:
  schedule:
    # fires every 5 hours as a safety net to restart the loop.
    # GitHub cron is unreliable (can delay 2-4 hrs), but that's fine
    # because the RUNNING job already pings every 10 min continuously.
    - cron: '0 */5 * * *'
  workflow_dispatch:

# only allow one instance at a time so we don't stack runners
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keep-alive-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Continuous keep-alive ping (loops for ~5 h 45 min)
        run: |
          # --------------------------------------------------------
          # This job pings both Render health endpoints every 10 minutes
          # in a loop for ~5 hours 45 minutes. The cron restarts
          # the job every 5 hours, so there is always overlap and
          # neither server ever hits Render's 15-minute idle timeout.
          # --------------------------------------------------------

          DURATION=20700          # 5 hours 45 minutes in seconds
          INTERVAL=600            # 10 minutes in seconds (well under Render's 15-min idle limit)
          
          DJANGO_URL="https://healthscribe-django.onrender.com/health"
          AI_URL="https://healthscribe-ai-xexh.onrender.com/health"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          END_TIME=$((SECONDS + DURATION))
          PING_NUM=0

          echo "=== HealthScribe Keep-Alive Loop Started ==="
          echo "Django URL: $DJANGO_URL"
          echo "AI Service URL: $AI_URL"
          echo "Will run for $((DURATION / 3600))h $((DURATION % 3600 / 60))m"
          echo "Ping interval: $((INTERVAL / 60)) minutes"
          echo ""

          while [ $SECONDS -lt $END_TIME ]; do
            PING_NUM=$((PING_NUM + 1))
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

            # 1. Ping Django Backend
            DJANGO_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              -H "User-Agent: $UA" \
              -H "Accept: application/json" \
              "$DJANGO_URL" 2>/dev/null || echo "000")

            # 2. Ping FastAPI AI Service
            AI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 120 \
              -H "User-Agent: $UA" \
              -H "Accept: application/json" \
              "$AI_URL" 2>/dev/null || echo "000")

            if [ "$DJANGO_STATUS" != "200" ]; then
              sleep 5
              DJANGO_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 120 \
                -H "User-Agent: $UA" \
                -H "Accept: application/json" \
                "$DJANGO_URL" 2>/dev/null || echo "000")
            fi

            if [ "$AI_STATUS" != "200" ]; then
              sleep 5
              AI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 120 \
                -H "User-Agent: $UA" \
                -H "Accept: application/json" \
                "$AI_URL" 2>/dev/null || echo "000")
            fi

            echo "[$TIMESTAMP] Ping #$PING_NUM — Django: $DJANGO_STATUS | AI: $AI_STATUS"

            # sleep until next ping (unless loop time is up)
            REMAINING=$((END_TIME - SECONDS))
            if [ $REMAINING -gt $INTERVAL ]; then
              sleep $INTERVAL
            else
              sleep $REMAINING 2>/dev/null || true
            fi
          done

          echo ""
          echo "=== Loop finished after $PING_NUM pings ==="
          echo "Cron will restart this job shortly."
